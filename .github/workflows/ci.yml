name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Classify change (main and manual runs always use full gates)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python tool/verify.py scope
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tool/verify.py docs
      - run: python -m unittest discover -s tool -p 'test_*.py' -v
      - name: Read Flutter pin
        if: needs.scope.outputs.scope == 'full'
        id: sdk
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: needs.scope.outputs.scope == 'full'
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - name: Analyze and run the full Flutter regression suite
        if: needs.scope.outputs.scope == 'full'
        run: python tool/verify.py quick

  schema:
    name: Schema
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sherko_pharma_test
        options: >-
          --health-cmd "pg_isready -U postgres -d sherko_pharma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare Supabase-compatible test roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat backend/tests/000_supabase_test_bootstrap.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test
      - name: Apply migrations
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat backend/migrations/*.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test
      - name: Run synthetic backend tests
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat backend/tests/001_product_schema_test.sql backend/tests/002_owner_catalog_api_test.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test
      - name: Verify signup is disabled
        shell: bash
        run: |
          grep -Fx 'enable_signup = false' supabase/config.toml
          grep -Fx 'enable_anonymous_sign_ins = false' supabase/config.toml
          test "$(grep -Fc 'enable_signup = false' supabase/config.toml)" -eq 3
      - name: Dry-run synthetic controlled import
        run: >-
          python tool/catalog_import.py dry-run
          --source backend/tests/fixtures/catalog_import_valid.csv
          --contract backend/tests/fixtures/catalog_import_contract.json
      - name: Generate synthetic controlled import SQL
        run: >-
          python tool/catalog_import.py emit-sql
          --source backend/tests/fixtures/catalog_import_valid.csv
          --contract backend/tests/fixtures/catalog_import_contract.json
          --output /tmp/catalog-import.sql
      - name: Apply first synthetic import
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat /tmp/catalog-import.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test
      - name: Mutate imported data and create a missing-row rerun case
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat backend/tests/003_import_after_first.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test
      - name: Reapply identical import
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat /tmp/catalog-import.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test
      - name: Verify owner edit preservation and missing-row recovery
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat backend/tests/004_import_after_repeat.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test
      - name: Seed unexpected row under the same dataset key
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat backend/tests/005_import_rogue_setup.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test
      - name: Reject unexpected existing source IDs
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          if cat /tmp/catalog-import.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test; then
            echo "::error::Controlled import unexpectedly accepted an unapproved source_id."
            exit 1
          fi
          echo "Expected controlled-import rejection confirmed."
      - name: Clean synthetic import state
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: cat backend/tests/006_import_cleanup.sql | docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d sherko_pharma_test

  android:
    name: Android build
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.18+8'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - id: sdk
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - run: python tool/verify.py android

  windows:
    name: Windows build
    needs: scope
    if: needs.scope.outputs.scope == 'full'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: sdk
        shell: pwsh
        run: '"version=$((Get-Content .flutter-version).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - run: python tool/verify.py windows

  required:
    name: Required verification
    if: always()
    needs: [scope, quality, schema, android, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require every applicable gate
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python tool/verify.py gate
