name: Bounded development task
description: Define one reviewable implementation or workflow change.
title: "SP-XXX: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and scope
      description: State the user-visible outcome and the bounded change.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
      description: Link owning requirements, relevant code, dependencies and decisions.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Non-goals
      description: List behavior and areas that must not change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance examples
      description: Give concrete inputs/actions and expected outputs, including relevant failure and persistence cases.
      placeholder: "Given ..., when ..., then ..."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Review and optional local verification
      description: Note useful local checks, owner/device testing, data/authorization risk, and any explicit production approval needed. Hosted CI is not required.
    validations:
      required: false
